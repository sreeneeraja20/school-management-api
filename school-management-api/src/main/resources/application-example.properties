# Server
server.port=8080
server.servlet.context-path=/

# Application
spring.application.name=School Management API

# Database (MSSQL)
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=schoolmanagement;trustServerCertificate=true;encrypt=false
spring.datasource.username=your_db_username
spring.datasource.password=your_db_password
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT
jwt.secret=your-super-secret-key-that-should-be-at-least-32-characters-long-for-hs256
jwt.expiration-ms=86400000
jwt.parent-expiration-ms=604800000

# CORS
app.cors.allowed-origins=http://localhost:4200,http://localhost:3000

# Logging
logging.level.root=INFO
logging.level.com.schoolmanagement=DEBUG
logging.level.org.springframework.security=DEBUG

# OpenAPI / Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.api-docs.path=/v3/api-docs
